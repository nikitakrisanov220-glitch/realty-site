<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контакты и реквизиты — DomPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contacts">
<div id="header"></div>
<section><div class="wrap"><h2>Контакты и реквизиты</h2>
<div class="two">
  <div class="panel"><h3 style="margin-bottom:12px">Реквизиты компании</h3>
    <table class="req" id="req" style="width:100%;border-collapse:collapse"></table>
    <p class="meta" style="margin-top:10px">Данные сгенерированы случайно и не принадлежат реальной организации.</p>
    <div style="display:flex;gap:10px;margin-top:14px"><button class="btn" id="gen">Сгенерировать новые</button><button class="btn alt" id="copy">Копировать</button></div>
    <p class="ok" id="copied" hidden>Скопировано</p></div>
  <div class="panel"><h3 style="margin-bottom:12px">Напишите нам</h3>
    <form id="msg"><input required placeholder="Имя"><input required type="email" placeholder="E-mail"><textarea required rows="5" placeholder="Сообщение"></textarea><button class="btn">Отправить</button></form>
    <p class="ok" id="sent" hidden>Спасибо! Сообщение отправлено.</p>
    <p class="meta" style="margin-top:16px">Варшава, ul. Złota 44<br>Пн–Пт 9:00–18:00 · +48 123 456 789</p></div>
</div></div></section>
<div id="footer"></div>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
