<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DomPro — продажа квартир</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
<div id="header"></div>
<div class="hero"><div class="wrap">
  <h1>Найдите квартиру, в которой хочется жить</h1>
  <p>Проверенные объекты в лучших районах Варшавы. Честные цены, реальные фото, помощь с ипотекой.</p>
  <div class="stats"><div><b>8</b>объектов в каталоге</div><div><b>4</b>района</div><div><b>98 000 €</b>минимальная цена</div></div>
</div></div>
<section><div class="wrap">
  <h2>Каталог квартир</h2>
  <div class="filter">
    <label>Поиск<input id="q" placeholder="Название или улица"></label>
    <label>Район<select id="district"></select></label>
    <label>Комнат<select id="rooms"><option value="">Любое</option><option>1</option><option>2</option><option>3</option><option value="4">4+</option></select></label>
    <label>Цена до, €<input id="maxPrice" type="number" min="0" step="10000" placeholder="например 250000"></label>
    <label>Сортировка<select id="sort"><option value="">По умолчанию</option><option value="asc">Сначала дешёвые</option><option value="desc">Сначала дорогие</option><option value="area">По площади</option></select></label>
    <label>&nbsp;<button class="btn alt" id="reset" type="button">Сбросить</button></label>
  </div>
  <p class="meta" id="count" style="margin-bottom:12px"></p>
  <div class="grid" id="list"></div>
</div></section>
<div id="footer"></div>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
